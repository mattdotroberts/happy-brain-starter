name: lint
on: [push, pull_request]
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the wiki
        run: python3 scripts/lint.py
      - name: Session brief runs without AGENTS.md
        run: echo '{}' | python3 scripts/session-brief.py
